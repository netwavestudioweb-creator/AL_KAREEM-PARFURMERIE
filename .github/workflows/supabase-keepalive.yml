# .github/workflows/supabase-keepalive.yml
#
# Déclenche keep-supabase-alive.mjs toutes les 6 jours pour empêcher
# la mise en pause automatique de la base de données Supabase (seuil : 7 jours).
#
# ⚙️  Setup requis une seule fois dans GitHub :
#   Settings → Secrets and variables → Actions → New repository secret
#   - SUPABASE_URL            = https://zoagwbhgpaslyjjsdnnv.supabase.co
#   - SUPABASE_PUBLISHABLE_KEY = sb_publishable_HF_...

name: 🛡️ Supabase Keepalive

on:
  # Toutes les 6 jours à 08h00 UTC
  schedule:
    - cron: "0 8 */6 * *"

  # Déclenchement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch:

jobs:
  ping:
    name: Ping la base de données Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 🏓 Exécuter le script keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/keep-supabase-alive.mjs

      - name: 📅 Date du dernier ping
        run: echo "✅ Ping effectué le $(date -u '+%Y-%m-%d à %H:%M UTC')"
