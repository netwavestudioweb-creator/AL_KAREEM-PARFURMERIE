# .github/workflows/supabase-keepalive.yml
#
# Déclenche keep-supabase-alive.mjs deux fois par semaine pour empêcher
# la mise en pause automatique des bases Supabase (seuil : 7 jours d'inactivité).
#
# ⚙️  Secrets requis (Settings → Secrets and variables → Actions) :
#   - SUPABASE_URL               = https://zoagwbhgpaslyjjsdnnv.supabase.co   (base du site)
#   - SUPABASE_PUBLISHABLE_KEY   = sb_publishable_HF_...
#   Facultatif, pour une seconde base :
#   - SUPABASE_URL_2             = https://<projet>.supabase.co
#   - SUPABASE_PUBLISHABLE_KEY_2 = sb_publishable_...

name: 🛡️ Supabase Keepalive

on:
  # Lundi et jeudi à 08h00 UTC : jamais plus de 4 jours entre deux pings,
  # même si GitHub retarde l'exécution de plusieurs heures.
  # (L'ancien "*/6" sur le jour du mois repartait au 1er de chaque mois.)
  schedule:
    - cron: "0 8 * * 1,4"

  # Déclenchement manuel depuis l'onglet "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    name: Ping des bases de données Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 🏓 Exécuter le script keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_PUBLISHABLE_KEY_2: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_2 }}
        run: node scripts/keep-supabase-alive.mjs

      # GitHub désactive les tâches planifiées d'un dépôt sans commit depuis 60 jours.
      # On réactive le workflow à chaque passage pour qu'il ne s'arrête jamais.
      - name: ♻️ Garder le workflow actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable supabase-keepalive.yml --repo "${{ github.repository }}" || true
